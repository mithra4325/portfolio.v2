<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &bull; Mithra Ravi — Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at 50% 20%, rgba(128, 0, 32, 0.25) 0%, #0a0a0a 70%);
    }
    .login-container {
      width: 100%;
      max-width: 440px;
    }
    .login-card {
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8), 0 0 25px rgba(128, 0, 32, 0.35);
      transition: var(--transition);
    }
    .login-card:hover {
      border-color: rgba(128, 0, 32, 0.6);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(128, 0, 32, 0.45);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(128, 0, 32, 0.6);
      background: rgba(128, 0, 32, 0.2);
      color: #ff6b8b;
      display: inline-block;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.35rem;
      font-family: var(--font-heading);
    }
    .login-subtitle {
      font-size: 0.925rem;
      color: var(--text-secondary);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
      font-family: var(--font-mono);
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #141414;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: var(--font-sans);
      transition: var(--transition);
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--maroon);
      box-shadow: 0 0 10px var(--glow-maroon);
    }
    .login-btn {
      width: 100%;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      display: inline-block;
      box-sizing: border-box;
      cursor: pointer;
      margin-top: 0.5rem;
      border: 1px solid var(--maroon);
      background: var(--maroon);
      color: #ffffff;
      border-radius: 4px;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 0 15px var(--glow-maroon);
    }
    .login-btn:hover {
      background: var(--maroon-hover);
      border-color: var(--maroon-hover);
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(158, 26, 56, 0.5);
    }
    .guest-btn {
      width: 100%;
      padding: 0.75rem 1.5rem;
      font-size: 0.925rem;
      font-weight: 500;
      text-align: center;
      display: inline-block;
      box-sizing: border-box;
      margin-top: 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 4px;
      text-decoration: none;
      transition: var(--transition);
    }
    .guest-btn:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      background: rgba(255, 255, 255, 0.03);
    }
    .login-footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.825rem;
      color: #718096;
    }
  </style>
</head>
<body>

  <main class="login-wrapper">
    <div class="login-container">
      <div class="login-card">
        
        <!-- HEADER / BRANDING -->
        <div class="login-brand">
          <span class="login-badge">PORTFOLIO PORTAL</span>
          <h1 class="login-title">Mithra Ravi</h1>
          <p class="login-subtitle">AI &amp; IoT Engineering Portfolio</p>
        </div>

        <!-- STATIC FORM LEADING DIRECTLY TO INDEX.HTML -->
        <form action="index.html" method="get">
          <div class="form-group">
            <label class="form-label" for="username">Username / Email</label>
            <input class="form-input" type="text" id="username" name="username" value="guest@portfolio.dev" placeholder="Enter username or email" autocomplete="username">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Access Passkey</label>
            <input class="form-input" type="password" id="password" name="password" value="portfolio2026" placeholder="Enter password" autocomplete="current-password">
          </div>

          <!-- STATIC NAVIGATION FLOW: SUBMIT / BUTTON DIRECTS TO INDEX.HTML -->
          <button type="submit" class="login-btn">
            Login &amp; Enter Portfolio &rarr;
          </button>

          <!-- DIRECT STATIC ANCHOR LINK BACKUP -->
          <a href="index.html" class="guest-btn">
            Continue to Portfolio &rarr;
          </a>
        </form>

        <p class="login-footer-text">
          Static Navigation Flow &bull; Pure HTML &amp; CSS &bull; Direct access to index.html
        </p>

      </div>
    </div>
  </main>

</body>
</html>
